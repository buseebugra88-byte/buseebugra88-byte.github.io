<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Yönetim — Buse Buğra</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
<script src="icerik.js"></script>
<script>document.documentElement.dataset.tema=(window.ICERIK&&ICERIK.tema)||"pudra"</script>
<style>
body{background:var(--mist)}
.adm-top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.adm-top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:12px max(4vw,16px)}
.adm-top .brand{margin-right:auto}
.adm-top .brand small{font:500 14px var(--sans);color:var(--soft);margin-left:6px}
.pill{font-size:14px;color:var(--soft)}
.pill.warn{color:var(--indigo);font-weight:600}
.adm{display:grid;grid-template-columns:220px minmax(0,1fr);gap:24px;max-width:1180px;margin:0 auto;padding:24px max(4vw,16px) 80px}
.tabs{display:grid;gap:4px;align-content:start;position:sticky;top:84px}
.tabs button{all:unset;cursor:pointer;padding:12px 14px;border-radius:12px;font-weight:600;color:var(--soft)}
.tabs button:hover{background:var(--bg);color:var(--ink)}
.tabs button[aria-selected=true]{background:var(--bg);color:var(--indigo)}
.tabs button:focus-visible{outline:2px solid var(--indigo)}
.panel{background:var(--bg);border-radius:20px;padding:clamp(18px,3vw,32px);display:grid;gap:22px;align-content:start}
.panel h2{font-size:28px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.list{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.list li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line)}
.list b{font:600 17px/1.3 var(--serif)}
.list small{display:block;color:var(--soft);font-size:13px;margin-top:2px}
.list .acts{display:flex;gap:6px}
.f{display:grid;gap:16px}
.f label{display:grid;gap:6px;font-size:14px;font-weight:600;color:var(--soft)}
.f .two{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px}
.f input,.f select,.f textarea{font:16px/1.5 var(--sans);color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:11px 13px;width:100%}
.f textarea{min-height:120px;resize:vertical}
.f textarea.big{min-height:380px;font:17px/1.7 var(--serif)}
.f input:focus,.f select:focus,.f textarea:focus{outline:none;border-color:var(--indigo)}
.f .hint{font-weight:400;font-size:13px;color:var(--soft)}
.f .chk{display:flex;gap:10px;align-items:center;font-weight:500;color:var(--ink)}
.f .chk input{width:20px;height:20px}
.toolbar{display:flex;flex-wrap:wrap;gap:6px}
.btn.xs{min-height:36px;padding:0 12px;font-size:14px;border-width:1px}
.btn.danger{border-color:var(--line);color:var(--soft)}
.thumb{width:84px;aspect-ratio:3/4;object-fit:cover;border-radius:8px;background:var(--mist)}
.imgrow{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.btn[disabled]{opacity:.45;cursor:default;box-shadow:none;transform:none}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:600;max-width:90vw;z-index:9;display:none}
.login{max-width:560px;margin:8vh auto;background:var(--bg);border-radius:22px;padding:32px;display:grid;gap:18px}
.login ol{margin:0;padding-left:20px;color:var(--soft);font-size:15px;display:grid;gap:6px}
.demo{background:var(--mist);border-radius:12px;padding:12px 14px;font-size:14px;color:var(--soft)}
.songs-ed{font:15px/1.6 var(--sans)!important}
@media(max-width:800px){.adm{grid-template-columns:minmax(0,1fr)}.tabs{position:static;grid-auto-flow:column;overflow-x:auto}.tabs button{white-space:nowrap}}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast" role="status"></div>
<script src="yazilar.js"></script>
<script src="kitaplar.js"></script>
<script src="site.js"></script>
<script src="yonetim.js"></script>
</body>
</html>
